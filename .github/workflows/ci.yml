name: ShopGenie AI Tests
"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests fastapi uvicorn streamlit chromadb google-genai python-dotenv sqlalchemy mlflow

      - name: Seed product database
        run: |
          python -m backend.add_laptop_products
          python -m backend.add_mobile_products

      - name: Start backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/docs > /dev/null; then
              echo "Backend started successfully"
              exit 0
            fi
            sleep 2
          done
          cat backend.log
          exit 1

      - name: Run tests
        run: python -m pytest -v